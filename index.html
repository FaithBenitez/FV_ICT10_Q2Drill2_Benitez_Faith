<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Drill2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">

    <style>
        body {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;         
        background-image: url(https://i.pinimg.com/1200x/d2/31/c2/d231c22f07d72dc3119616073b744a61.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 50px;
        min-height: 100vh;
        }
        
        .SciForm {
        background-color: rgb(122, 159, 117);
        width: 700px;
        padding: 30px;
        border-radius: 10px;
        text-align: center; 
           
        }

        #button{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'TrebuchetMS', sans-serif;
        width: 250px;
        height: 30px;
        background-color: rgb(17, 56, 17);
        color: rgb(247, 247, 243);
        border: none;
        cursor: pointer;
        border-radius: 15px;

        #output1{
        background-color: #f4f6f9;
        margin-top: 10px;
        color: rgb(17, 56, 17);
        border-radius: 10px;
        }

    
        h1{

        }

        p{

        }

<body>
<div class="SciForm">
    <h1>Science Club Members</h1>
    <p>Sign Up for Science Club Today!</p>     
        <input type="text" id="fname" placeholder="Enter first name...." class="form-control mb-3">
        <input type="text" id="lname" placeholder="Enter last name..." class="form-control mb-3">
        <button type="button" id="button" py-click="add_member">Sign Up</button>
   
    <div id="output1"></div>
</div>

<script type="py" src="main.py"></script>
